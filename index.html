<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#020403"
>

<title>Transmission</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"
  rel="stylesheet"
>

<style>

/* =========================================================
   ROOT
   ========================================================= */

:root{

  --green:#15cd96;
  --black:#020403;

  --font:
    'Share Tech Mono',
    'Courier New',
    monospace;

  --start-font:
    'Share Tech Mono',
    'Courier New',
    monospace;

  --matrix-font-size:11px;

}


/* =========================================================
   GLOBAL
   ========================================================= */

*{

  box-sizing:border-box;

  -webkit-tap-highlight-color:
    transparent;

}


html,
body{

  margin:0;
  padding:0;

  width:100%;
  height:100%;

  background:
    var(--black);

  overflow:hidden;

  font-family:
    var(--font);

  text-transform:
    uppercase;

}


body.keyboard-open{

  overflow:hidden;

}


#app{

  position:fixed;

  inset:0;

  width:100%;

  height:100dvh;

  background:
    var(--black);

}


/* =========================================================
   WHITE START SCREEN
   ========================================================= */

#white{

  position:absolute;

  inset:0;

  background:#fdfdfd;

  z-index:50;

  display:flex;

  align-items:flex-end;

  justify-content:center;

  padding-bottom:14dvh;

}


#white span{

  font-family:
    var(--start-font);

  font-size:12px;

  letter-spacing:.2em;

  color:#2b2b2b;

  opacity:0;

  animation:
    fadein 1s ease forwards .9s;

}


@keyframes fadein{

  to{
    opacity:1;
  }

}


#white.hidden{

  display:none;

}


/* =========================================================
   GLITCH
   ========================================================= */

#glitch{

  position:absolute;

  inset:0;

  z-index:60;

  background:#fff;

  display:none;

  pointer-events:none;

}


#glitch.active{

  display:block;

  animation:
    glitchflash .55s steps(2,end) forwards;

}


#glitch::before,
#glitch::after{

  content:"";

  position:absolute;

  inset:0;

  background:#000;

  mix-blend-mode:difference;

}


#glitch.active::before{

  animation:
    slice1 .55s steps(6,end) forwards;

}


#glitch.active::after{

  animation:
    slice2 .55s steps(8,end) forwards;

}


@keyframes glitchflash{

  0%{
    background:#fff;
  }

  15%{
    background:#000;
  }

  30%{
    background:#39ff6a;
  }

  45%{
    background:#000;
  }

  60%{
    background:#fff;
  }

  75%{
    background:#000;
  }

  100%{
    background:#000;
    opacity:0;
  }

}


@keyframes slice1{

  0%{
    clip-path:inset(10% 0 70% 0);
    transform:translateX(-4%);
  }

  20%{
    clip-path:inset(60% 0 5% 0);
    transform:translateX(3%);
  }

  40%{
    clip-path:inset(30% 0 40% 0);
    transform:translateX(-6%);
  }

  60%{
    clip-path:inset(5% 0 80% 0);
    transform:translateX(2%);
  }

  80%{
    clip-path:inset(75% 0 2% 0);
    transform:translateX(-2%);
  }

  100%{
    clip-path:inset(0 0 100% 0);
    transform:translateX(0);
    opacity:0;
  }

}


@keyframes slice2{

  0%{
    clip-path:inset(80% 0 5% 0);
    transform:translateX(5%);
  }

  25%{
    clip-path:inset(20% 0 60% 0);
    transform:translateX(-3%);
  }

  50%{
    clip-path:inset(45% 0 20% 0);
    transform:translateX(4%);
  }

  75%{
    clip-path:inset(10% 0 75% 0);
    transform:translateX(-5%);
  }

  100%{
    clip-path:inset(100% 0 0 0);
    transform:translateX(0);
    opacity:0;
  }

}


/* =========================================================
   MATRIX
   ========================================================= */

#matrix{

  position:absolute;

  inset:0;

  z-index:10;

  background:
    var(--black);

  opacity:0;

}


#matrix.visible{

  opacity:1;

}


canvas#rain{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

}


#scrim{

  position:absolute;

  inset:0;

  background:

    radial-gradient(
      ellipse at 50% 40%,
      rgba(2,4,3,.35) 0%,
      rgba(2,4,3,.82) 65%,
      rgba(2,4,3,.95) 100%
    );

}


#content{

  position:relative;

  z-index:20;

  height:100%;

  display:flex;

  flex-direction:column;

  justify-content:center;

  padding:7vh 6vw;

  color:
    var(--green);

  max-width:520px;

  margin:0 auto;

}


body.keyboard-open #content{

  padding-bottom:300px;

}


#term{

  font-size:
    var(--matrix-font-size);

  line-height:1.5;

  white-space:pre-wrap;

  min-height:38vh;

  color:
    var(--green);

}


.cursor{

  display:inline-block;

  width:.55em;

  height:1em;

  background:
    var(--green);

  vertical-align:text-bottom;

  margin-left:2px;

  animation:
    blink 1s steps(1) infinite;

}


@keyframes blink{

  50%{
    opacity:0;
  }

}


/* =========================================================
   CHOICE
   ========================================================= */

#choice{

  margin-top:
    calc(var(--matrix-font-size) * .8);

  display:none;

  flex-direction:column;

  gap:
    calc(var(--matrix-font-size) * 1.5);

}


#choice.visible{

  display:flex;

}


.code-choice-btn{

  font-family:
    var(--font);

  font-size:
    var(--matrix-font-size);

  letter-spacing:.05em;

  padding:0;

  background:transparent;

  border:none;

  color:
    var(--green);

  text-align:left;

  cursor:pointer;

  text-transform:uppercase;

}


.code-choice-btn:active{

  opacity:.55;

}


/* =========================================================
   INPUT
   ========================================================= */

.virtual-input{

  font-family:
    var(--font);

  font-size:
    var(--matrix-font-size);

  color:
    var(--green);

  letter-spacing:.05em;

  cursor:pointer;

  border-bottom:
    1px dashed
    rgba(21,205,150,.35);

}


.virtual-input:hover{

  border-bottom:
    1px solid
    rgba(21,205,150,.8);

}


/* =========================================================
   SUBMIT
   ========================================================= */

.inline-submit{

  font-family:
    var(--font);

  font-size:
    var(--matrix-font-size);

  letter-spacing:.1em;

  background:transparent;

  color:
    var(--green);

  border:
    1px solid
    var(--green);

  padding:

    calc(var(--matrix-font-size)*.5)

    calc(var(--matrix-font-size)*.9);

  margin-top:

    calc(var(--matrix-font-size)*1.5);

  cursor:pointer;

  text-transform:uppercase;

}


.inline-submit:disabled{

  opacity:.35;

}


.status-line{

  margin-top:

    calc(var(--matrix-font-size)*.9);

  font-size:
    var(--matrix-font-size);

  color:
    var(--green);

  opacity:.85;

}


/* =========================================================
   COUNTDOWN
   ========================================================= */

#countdown{

  display:none;

  text-align:left;

}


#countdown.visible{

  display:block;

  animation:
    riseIn .5s ease forwards;

}


#countdown .cd-label{

  font-size:
    calc(var(--matrix-font-size)*.85);

  letter-spacing:.1em;

  opacity:.8;

  margin-bottom:14px;

}


#countdown .cd-time{

  font-size:
    calc(var(--matrix-font-size)*1.7);

  letter-spacing:.04em;

  line-height:1.4;

}


@keyframes riseIn{

  from{

    opacity:0;

    transform:
      translateY(10px);

  }

  to{

    opacity:1;

    transform:
      translateY(0);

  }

}


/* =========================================================
   VIRTUAL KEYBOARD
   ========================================================= */

.matrix-keyboard{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:100;

  display:none;

  padding:
    10px
    8px
    calc(8px + env(safe-area-inset-bottom));

  background:
    rgba(2,4,3,.98);

  border-top:
    1px solid
    rgba(21,205,150,.45);

  box-shadow:
    0 -8px 30px
    rgba(0,0,0,.65);

  font-family:
    var(--font);

}


.matrix-keyboard.visible{

  display:block;

}


.keyboard-row{

  display:flex;

  gap:5px;

  margin-bottom:5px;

}


.keyboard-key{

  flex:1;

  min-width:0;

  height:42px;

  padding:0;

  border:
    1px solid
    rgba(21,205,150,.45);

  background:#020403;

  color:
    var(--green);

  font-family:
    var(--font);

  font-size:15px;

  line-height:1;

  appearance:none;

  border-radius:0;

  touch-action:manipulation;

  user-select:none;

}


.keyboard-key:active,
.keyboard-key.pressed{

  background:
    var(--green);

  color:#020403;

  box-shadow:
    0 0 12px
    rgba(21,205,150,.8);

}


.keyboard-key.wide{

  flex:1.7;

}


.keyboard-key.space{

  flex:4;

}


.keyboard-key.enter{

  flex:1.5;

}


@media(max-width:380px){

  .keyboard-key{

    height:38px;

    font-size:13px;

  }

  body.keyboard-open #content{

    padding-bottom:275px;

  }

}

</style>

</head>


<body>


<div id="app">

  <div id="white">

    <span>
      YOU HAVE BEEN CHOSEN 
    </span>

  </div>


  <div id="glitch"></div>


  <div id="matrix">

    <canvas id="rain"></canvas>

    <div id="scrim"></div>


    <div id="content">

      <div id="term"></div>


      <div id="choice">

        <button
          class="code-choice-btn"
          id="opt-red"
          type="button"
        >
          &gt; RED PILL — JOIN THE MATRIX
        </button>


        <button
          class="code-choice-btn"
          id="opt-blue"
          type="button"
        >
          &gt; BLUE PILL — REFUSE THE MATRIX
        </button>

      </div>


      <div id="countdown"></div>

    </div>

  </div>

</div>


<!-- =========================================================
     VIRTUAL KEYBOARD
     ========================================================= -->

<div
  id="matrixKeyboard"
  class="matrix-keyboard"
>

  <div class="keyboard-row">

    <button class="keyboard-key" data-key="Q" type="button">Q</button>
    <button class="keyboard-key" data-key="W" type="button">W</button>
    <button class="keyboard-key" data-key="E" type="button">E</button>
    <button class="keyboard-key" data-key="R" type="button">R</button>
    <button class="keyboard-key" data-key="T" type="button">T</button>
    <button class="keyboard-key" data-key="Z" type="button">Z</button>
    <button class="keyboard-key" data-key="U" type="button">U</button>
    <button class="keyboard-key" data-key="I" type="button">I</button>
    <button class="keyboard-key" data-key="O" type="button">O</button>
    <button class="keyboard-key" data-key="P" type="button">P</button>

  </div>


  <div class="keyboard-row">

    <button class="keyboard-key" data-key="A" type="button">A</button>
    <button class="keyboard-key" data-key="S" type="button">S</button>
    <button class="keyboard-key" data-key="D" type="button">D</button>
    <button class="keyboard-key" data-key="F" type="button">F</button>
    <button class="keyboard-key" data-key="G" type="button">G</button>
    <button class="keyboard-key" data-key="H" type="button">H</button>
    <button class="keyboard-key" data-key="J" type="button">J</button>
    <button class="keyboard-key" data-key="K" type="button">K</button>
    <button class="keyboard-key" data-key="L" type="button">L</button>

  </div>


  <div class="keyboard-row">

    <button class="keyboard-key" data-key="Y" type="button">Y</button>
    <button class="keyboard-key" data-key="X" type="button">X</button>
    <button class="keyboard-key" data-key="C" type="button">C</button>
    <button class="keyboard-key" data-key="V" type="button">V</button>
    <button class="keyboard-key" data-key="B" type="button">B</button>
    <button class="keyboard-key" data-key="N" type="button">N</button>
    <button class="keyboard-key" data-key="M" type="button">M</button>
    <button class="keyboard-key" data-key="Ä" type="button">Ä</button>
    <button class="keyboard-key" data-key="Ö" type="button">Ö</button>
    <button class="keyboard-key" data-key="Ü" type="button">Ü</button>

  </div>


  <div class="keyboard-row">

    <button
      class="keyboard-key wide"
      data-action="backspace"
      type="button"
    >
      ⌫
    </button>


    <button
      class="keyboard-key space"
      data-key=" "
      type="button"
    >
      SPACE
    </button>


    <button
      class="keyboard-key enter"
      data-action="enter"
      type="button"
    >
      ✓
    </button>

  </div>

</div>


<script>

/* =========================================================
   CONFIG
   ========================================================= */

const CONFIG = {

  /*
   * HIER DEINE AKTUELLE /exec WEB-APP-URL EINTRAGEN
   */

  sheetURL:
    "https://script.google.com/macros/s/AKfycbzIxhO184zUCnZiiXuUejnvceABSvxqMi2i4yHsN2dsw1Qogop5b5ksqEgeeSkOz7l80Q/exec",


  eventName:
    "HG_GG_HALLOWEEN",


  date:
    "31.10.2026",


  time:
    "19:00",


  location:
    "48.122047424316406,11.604446411132812",


  dresscode:
    "Science Fiction",


  startScreenText:
    "YOU HAVE BEEN GIVEN THE CHOICE – TAP TO CONTINUE",


  matrixFontSize:
    "11px",


  pillPromptDelay:
    1600,


  pillQuestion:
    "WILL YOU CHOOSE THE RED PILL OR THE BLUE PILL?",


  /* =====================================================
     TIMING
     ===================================================== */

  /*
   * Zeit zwischen TRANSMITTING DATA
   * und HELLO NAME
   *
   * 2000 = 2 Sekunden
   */

  transmittingDuration:
    2000,


  /*
   * Wie lange HELLO NAME stehen bleibt,
   * bevor der Glitch startet.
   *
   * 2000 = 2 Sekunden
   */

  welcomeDuration:
    2000,


  /*
   * Geschwindigkeit des Typewriters
   */

  typeSpeedMin:
    16,


  typeSpeedRandom:
    22

};


/* =========================================================
   CSS CONFIG
   ========================================================= */

document.documentElement.style.setProperty(
  "--matrix-font-size",
  CONFIG.matrixFontSize
);


document.querySelector(
  "#white span"
).textContent =
  CONFIG.startScreenText;


/* =========================================================
   ELEMENTS
   ========================================================= */

const whiteEl =
  document.getElementById("white");

const glitchEl =
  document.getElementById("glitch");

const matrixEl =
  document.getElementById("matrix");

const termEl =
  document.getElementById("term");

const choiceEl =
  document.getElementById("choice");

const countdownEl =
  document.getElementById("countdown");

const matrixKeyboard =
  document.getElementById("matrixKeyboard");


let started = false;


/* =========================================================
   START
   ========================================================= */

function startSequence(){

  if(started)
    return;

  started = true;


  glitchEl.classList.add(
    "active"
  );


  setTimeout(
    () => {

      whiteEl.classList.add(
        "hidden"
      );

    },
    120
  );


  setTimeout(
    () => {

      matrixEl.classList.add(
        "visible"
      );

      startRain();

      runTerminal();

    },
    260
  );


  setTimeout(
    () => {

      glitchEl.classList.remove(
        "active"
      );

    },
    600
  );

}


document.body.addEventListener(
  "click",
  startSequence,
  {
    once:true
  }
);


/* =========================================================
   MATRIX RAIN
   ========================================================= */

const canvas =
  document.getElementById("rain");

const ctx =
  canvas.getContext("2d");


let columns;
let drops;


const chars =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";


function resizeCanvas(){

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;


  const fontSize =
    16;


  columns =
    Math.floor(
      canvas.width /
      fontSize
    );


  drops =
    new Array(columns)
      .fill(0)
      .map(
        () =>
          Math.floor(
            Math.random()*-40
          )
      );

}


window.addEventListener(
  "resize",
  resizeCanvas
);


resizeCanvas();


let rainRunning =
  false;


function startRain(){

  if(rainRunning)
    return;

  rainRunning = true;


  const fontSize =
    16;


  function draw(){

    ctx.fillStyle =
      "rgba(2,4,3,0.16)";


    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ctx.font =
      '600 ' +
      fontSize +
      'px "Share Tech Mono", monospace';


    for(
      let i=0;
      i<drops.length;
      i++
    ){

      const text =
        chars[
          Math.floor(
            Math.random() *
            chars.length
          )
        ];


      const x =
        i * fontSize;


      const y =
        drops[i] *
        fontSize;


      if(
        Math.random() > .965
      ){

        ctx.fillStyle =
          "#e9fff1";

      }else{

        ctx.fillStyle =
          "rgba(25,221,97," +
          (
            .35 +
            Math.random()*.5
          ) +
          ")";

      }


      ctx.fillText(
        text,
        x,
        y
      );


      if(
        y > canvas.height &&
        Math.random() > .975
      ){

        drops[i] = 0;

      }


      drops[i]++;

    }


    setTimeout(
      () =>
        requestAnimationFrame(draw),
      110
    );

  }


  draw();

}


/* =========================================================
   TYPEWRITER
   ========================================================= */

function typeLine(
  line,
  container
){

  return new Promise(
    resolve => {

      const span =
        document.createElement(
          "span"
        );


      container.appendChild(
        span
      );


      let i = 0;


      function step(){

        if(
          i < line.text.length
        ){

          span.textContent +=
            line.text[i];

          i++;


          setTimeout(
            step,
            CONFIG.typeSpeedMin +
            Math.random() *
            CONFIG.typeSpeedRandom
          );

        }else{

          container.appendChild(
            document.createElement(
              "br"
            )
          );


          setTimeout(
            resolve,
            line.pause || 100
          );

        }

      }


      step();

    }
  );

}


function delay(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/* =========================================================
   INTRO
   ========================================================= */

const introLines = [

  {
    text:
      "> initiating secure channel...",
    pause:550
  },

  {
    text:
      "> access granted",
    pause:550
  },

  {
    text:"",
    pause:250
  },

  {
    text:
      "> EVENT: " +
      CONFIG.eventName,
    pause:120
  },

  {
    text:
      "> DATE: " +
      CONFIG.date,
    pause:120
  },

  {
    text:
      "> TIME: " +
      CONFIG.time,
    pause:120
  },

  {
    text:
      "> LOCATION: " +
      CONFIG.location,
    pause:120
  },

  {
    text:
      "> DRESS CODE: " +
      CONFIG.dresscode,
    pause:120
  },

  {
    text:"",
    pause:200
  }

];


async function runTerminal(){

  const cursor =
    document.createElement(
      "span"
    );


  cursor.className =
    "cursor";


  termEl.appendChild(
    cursor
  );


  for(
    const line of introLines
  ){

    cursor.remove();


    await typeLine(
      line,
      termEl
    );


    termEl.appendChild(
      cursor
    );

  }


  cursor.remove();


  await delay(
    CONFIG.pillPromptDelay
  );


  await typeLine(
    {
      text:
        CONFIG.pillQuestion,

      pause:200
    },
    termEl
  );


  choiceEl.classList.add(
    "visible"
  );

}


/* =========================================================
   RSVP STATE
   ========================================================= */

let rsvpChoice =
  null;


const formData = {

  name:"",
  plusOne:false,
  plusOneName:""

};


/* =========================================================
   RED / BLUE
   ========================================================= */

document
  .getElementById("opt-red")
  .addEventListener(
    "click",
    () => {

      selectPill(
        "kommt",
        "RED PILL — JOIN THE MATRIX"
      );

    }
  );


document
  .getElementById("opt-blue")
  .addEventListener(
    "click",
    () => {

      selectPill(
        "kommt nicht",
        "BLUE PILL — REFUSE THE MATRIX"
      );

    }
  );


async function selectPill(
  choice,
  label
){

  rsvpChoice =
    choice;


  choiceEl.classList.remove(
    "visible"
  );


  await typeLine(
    {
      text:
        "> " + label,
      pause:250
    },
    termEl
  );


  if(
    choice === "kommt"
  ){

    await typeLine(
      {
        text:
          "> enter your details below",
        pause:300
      },
      termEl
    );


    await delay(150);


    runRsvpForm();

  }else{

    await typeLine(
      {
        text:
          "> entry logged. maybe next time.",
        pause:500
      },
      termEl
    );


    try{

      await sendToSheet({

        name:"",
        rsvp:"kommt nicht",
        plusOne:false,
        plusOneName:""

      });

    }catch(error){

      console.error(
        "Transmission error:",
        error
      );

    }


    triggerClosingGlitch(
      startCountdown
    );

  }

}


/* =========================================================
   KEYBOARD
   ========================================================= */

let activeInput = null;


function removeKeyboardListeners(){

  matrixKeyboard
    .querySelectorAll(
      ".keyboard-key"
    )
    .forEach(
      key => {

        if(
          key._matrixHandler
        ){

          key.removeEventListener(
            "click",
            key._matrixHandler
          );

          key._matrixHandler =
            null;

        }

      }
    );

}


/* =========================================================
   PROMPT INPUT
   ========================================================= */

function promptInput(
  promptText,
  existingValue = "",
  onSave = null
){

  return new Promise(
    async resolve => {

      await typePrompt(
        promptText
      );


      const valueSpan =
        document.createElement(
          "span"
        );


      valueSpan.className =
        "virtual-input";


      let value =
        existingValue || "";


      function updateDisplay(){

        valueSpan.textContent =
          value || "________";

        valueSpan.style.opacity =
          value ? "1" : ".25";

      }


      updateDisplay();


      termEl.appendChild(
        valueSpan
      );


      const cursor =
        document.createElement(
          "span"
        );


      cursor.className =
        "cursor";


      termEl.appendChild(
        cursor
      );


      function addCharacter(
        character
      ){

        value +=
          character;

        updateDisplay();

      }


      function deleteCharacter(){

        value =
          value.slice(
            0,
            -1
          );

        updateDisplay();

      }


      function closeKeyboard(){

        matrixKeyboard.classList.remove(
          "visible"
        );

        document.body.classList.remove(
          "keyboard-open"
        );

        removeKeyboardListeners();

        activeInput = null;

      }


      function submit(){

        const clean =
          value.trim();


        if(!clean)
          return;


        value =
          clean;


        updateDisplay();


        closeKeyboard();


        cursor.remove();


        termEl.appendChild(
          document.createElement(
            "br"
          )
        );


        if(onSave)
          onSave(clean);


        resolve(clean);

      }


      function openKeyboard(){

        activeInput = {

          getValue:
            () => value,

          setValue:
            v => {

              value =
                v;

              updateDisplay();

            }

        };


        matrixKeyboard.classList.add(
          "visible"
        );


        document.body.classList.add(
          "keyboard-open"
        );


        removeKeyboardListeners();


        matrixKeyboard
          .querySelectorAll(
            ".keyboard-key"
          )
          .forEach(
            key => {

              const handler =
                () => {

                  key.classList.add(
                    "pressed"
                  );


                  setTimeout(
                    () =>
                      key.classList.remove(
                        "pressed"
                      ),
                    100
                  );


                  const action =
                    key.dataset.action;


                  const character =
                    key.dataset.key;


                  if(
                    action ===
                    "backspace"
                  ){

                    deleteCharacter();

                  }

                  else if(
                    action ===
                    "enter"
                  ){

                    submit();

                  }

                  else if(
                    character !==
                    undefined
                  ){

                    addCharacter(
                      character
                    );

                  }

                };


              key._matrixHandler =
                handler;


              key.addEventListener(
                "click",
                handler
              );

            }
          );

      }


      /*
       * Feld bleibt anklickbar.
       *
       * Dadurch kann der bereits eingegebene
       * Name später wieder bearbeitet werden.
       */

      valueSpan.addEventListener(
        "click",
        openKeyboard
      );


      /*
       * Beim ersten Aufruf Tastatur öffnen.
       */

      openKeyboard();

    }
  );

}


/* =========================================================
   TYPE PROMPT
   ========================================================= */

function typePrompt(
  text
){

  return new Promise(
    resolve => {

      const span =
        document.createElement(
          "span"
        );


      termEl.appendChild(
        span
      );


      let i=0;


      function step(){

        if(
          i < text.length
        ){

          span.textContent +=
            text[i];

          i++;


          setTimeout(
            step,
            CONFIG.typeSpeedMin +
            Math.random() *
            CONFIG.typeSpeedRandom
          );

        }else{

          resolve();

        }

      }


      step();

    }
  );

}


/* =========================================================
   YES / NO
   ========================================================= */

function promptYesNo(
  promptText,
  currentValue = false
){

  return new Promise(
    async resolve => {

      await typePrompt(
        promptText + " "
      );


      const wrap =
        document.createElement(
          "span"
        );


      const yes =
        document.createElement(
          "span"
        );


      const no =
        document.createElement(
          "span"
        );


      yes.textContent =
        "[YES]";


      no.textContent =
        "[NO]";


      yes.className =
        "virtual-input";


      no.className =
        "virtual-input";


      wrap.appendChild(
        yes
      );


      wrap.appendChild(
        document.createTextNode(
          " "
        )
      );


      wrap.appendChild(
        no
      );


      termEl.appendChild(
        wrap
      );


      function choose(
        val,
        label
      ){

        wrap.remove();


        const chosen =
          document.createElement(
            "span"
          );


        chosen.className =
          "virtual-input";


        chosen.textContent =
          label;


        termEl.appendChild(
          chosen
        );


        termEl.appendChild(
          document.createElement(
            "br"
          )
        );


        resolve(val);

      }


      yes.addEventListener(
        "click",
        () =>
          choose(
            true,
            "[YES]"
          )
      );


      no.addEventListener(
        "click",
        () =>
          choose(
            false,
            "[NO]"
          )
      );

    }
  );

}


/* =========================================================
   RSVP FORM
   ========================================================= */

async function runRsvpForm(){

  formData.name =
    await promptInput(
      "NAME: ",
      formData.name
    );


  formData.plusOne =
    await promptYesNo(
      "PLUS ONE?",
      formData.plusOne
    );


  if(
    formData.plusOne
  ){

    formData.plusOneName =
      await promptInput(
        "NAME PLUS ONE: ",

      );

  }else{

  }


  await showFinalSubmit();

}


/* =========================================================
   FINAL SUBMIT
   ========================================================= */

function showFinalSubmit(){

  return new Promise(
    resolve => {

      termEl.appendChild(
        document.createElement(
          "br"
        )
      );


      const btn =
        document.createElement(
          "button"
        );


      btn.type =
        "button";


      btn.className =
        "inline-submit";


      btn.textContent =
        "> SUBMIT";


      termEl.appendChild(
        btn
      );


      btn.addEventListener(
        "click",
        async () => {

          btn.disabled =
            true;


          const statusEl =
            appendStatus(
              "> TRANSMITTING DATA"
            );


          const payload = {

            name:
              formData.name,

            rsvp:
              rsvpChoice,

            plusOne:
              formData.plusOne,

            plusOneName:
              formData.plusOneName

          };


          try{

            /*
             * Keyboard sicher schließen
             */

            matrixKeyboard.classList.remove(
              "visible"
            );


            document.body.classList.remove(
              "keyboard-open"
            );


            /*
             * Daten übertragen
             */

            await sendToSheet(
              payload
            );


            /*
             * TRANSMITTING DATA
             * bleibt für die konfigurierte
             * Dauer sichtbar.
             */

            statusEl.textContent =
              "> TRANSMITTING DATA";


            await delay(
              CONFIG.transmittingDuration
            );


            /*
             * Status entfernen
             */

            statusEl.textContent =
              "";


            /*
             * Begrüßung
             */

            await typeLine(
              {
                text:
                  "HELLO " +
                  formData.name.toUpperCase() +
                  ". WELCOME TO THE MATRIX.",

                pause:0

              },
              termEl
            );


            /*
             * Begrüßung stehen lassen
             */

            await delay(
              CONFIG.welcomeDuration
            );


            /*
             * Glitch
             */

            triggerClosingGlitch(
              startCountdown
            );


            resolve();

          }catch(error){

            console.error(
              "TRANSMISSION FAILED:",
              error
            );


            statusEl.textContent =
              "> TRANSMISSION FAILED";


            btn.disabled =
              false;

          }

        },
        {
          once:true
        }
      );

    }
  );

}

){

    );

  s.textContent =

/* =========================================================
   GOOGLE SHEETS
   ========================================================= */
async function sendToSheet(payload) {

  console.log("=== TRANSMISSION START ===");
  console.log("URL:", CONFIG.sheetURL);
  console.log("PAYLOAD:", payload);

  if (!CONFIG.sheetURL) {
    throw new Error("sheetURL fehlt");
  }

  const controller = new AbortController();

  const timeout = setTimeout(() => {
    console.error("TRANSMISSION TIMEOUT");
    controller.abort();
  }, 8000);

  try {

    const response = await fetch(CONFIG.sheetURL, {
      method: "POST",

      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify(payload),

      signal: controller.signal
    });

    clearTimeout(timeout);

    console.log("HTTP STATUS:", response.status);
    console.log("HTTP OK:", response.ok);

    const text = await response.text();

    console.log("RAW RESPONSE:", text);

    if (!response.ok) {
      throw new Error(
        "HTTP ERROR " + response.status
      );
    }

    let result;

    try {
      result = JSON.parse(text);
    } catch (e) {

      throw new Error(
        "Apps Script returned invalid JSON: " + text
      );

    }

    console.log("PARSED RESPONSE:", result);

    if (!result.success) {

      throw new Error(
        result.error ||
        "Apps Script returned success=false"
      );

    }

    console.log("=== TRANSMISSION SUCCESS ===");

    return result;

  } catch (error) {

    clearTimeout(timeout);

    console.error(
      "=== TRANSMISSION ERROR ===",
      error
    );

    if (error.name === "AbortError") {

      throw new Error(
        "Transmission timeout after 8 seconds"
      );

    }

    throw error;

  }

}

/* =========================================================
   COUNTDOWN
   ========================================================= */

function getPartyDate(){

  const [
    d,
    m,
    y
  ] =
    CONFIG.date
      .split(".")
      .map(Number);


  const [
    hh,
    mm
  ] =
    CONFIG.time
      .split(":")
      .map(Number);


  return new Date(
    y,
    m-1,
    d,
    hh,
    mm,
    0
  );

}


function pad(n){

  return String(n)
    .padStart(
      2,
      "0"
    );

}


function startCountdown(){

  countdownEl.classList.add(
    "visible"
  );


  const target =
    getPartyDate();


  function tick(){

    const diff =
      target -
      new Date();


    if(diff <= 0){

      countdownEl.innerHTML =

        '<div class="cd-label">' +
        '&gt; status' +
        '</div>' +

        '<div class="cd-time">' +
        CONFIG.eventName.toLowerCase() +
        ' is live' +
        '</div>';


      clearInterval(
        timer
      );


      return;

    }


    const s =
      Math.floor(
        diff / 1000
      );


    const days =
      Math.floor(
        s / 86400
      );


    const hours =
      Math.floor(
        (s % 86400) /
        3600
      );


    const mins =
      Math.floor(
        (s % 3600) /
        60
      );


    const secs =
      s % 60;


    countdownEl.innerHTML =

      '<div class="cd-label">' +
      '&gt; countdown to ' +
      CONFIG.eventName.toLowerCase() +
      '</div>' +

      '<div class="cd-time">' +

      pad(days) +
      'D ' +

      pad(hours) +
      'H ' +

      pad(mins) +
      'M ' +

      pad(secs) +

      'S' +

      '</div>';

  }


  tick();


  const timer =
    setInterval(
      tick,
      1000
    );

}
