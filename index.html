<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020403">
<title>Transmission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
  :root{
    --green:#15cd96;
    --black:#020403;
    --font: 'Share Tech Mono', 'Courier New', monospace;
    --start-font: 'Share Tech Mono', 'Courier New', monospace;
    --matrix-font-size: 12px;
  }

  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html,
  body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:var(--black);
    overflow:hidden;
    font-family:var(--font);
    text-transform:uppercase;
  }

  #app{
    position:fixed;
    inset:0;
    width:100%;
    height:100dvh;
    background:var(--black);
  }

  /* ---------- WHITE SCREEN ---------- */
  #white{
    position:absolute;
    inset:0;
    background:#fdfdfd;
    z-index:50;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:14dvh;
    transition:opacity .15s linear;
  }

  #white span{
    font-family:var(--start-font);
    font-size:12px;
    letter-spacing:.2em;
    color:#656565;
    opacity:0;
    animation:fadein 1s ease forwards .9s;
    text-transform:uppercase;
  }

  @keyframes fadein{
    to{opacity:1}
  }

  #white.hidden{
    display:none;
  }

  /* ---------- GLITCH OVERLAY ---------- */
  #glitch{
    position:absolute;
    inset:0;
    z-index:60;
    background:#fff;
    display:none;
    pointer-events:none;
  }

  #glitch.active{
    display:block;
    animation:glitchflash .55s steps(2,end) forwards;
  }

  #glitch::before,
  #glitch::after{
    content:"";
    position:absolute;
    inset:0;
    background:#000;
    mix-blend-mode:difference;
  }

  #glitch.active::before{
    animation:slice1 .55s steps(6,end) forwards;
  }

  #glitch.active::after{
    animation:slice2 .55s steps(8,end) forwards;
  }

  @keyframes glitchflash{
    0%{background:#fff;}
    15%{background:#000;}
    30%{background:#39ff6a;}
    45%{background:#000;}
    60%{background:#fff;}
    75%{background:#000;}
    100%{background:#000; opacity:0;}
  }

  @keyframes slice1{
    0%{
      clip-path:inset(10% 0 70% 0);
      transform:translateX(-4%);
    }
    20%{
      clip-path:inset(60% 0 5% 0);
      transform:translateX(3%);
    }
    40%{
      clip-path:inset(30% 0 40% 0);
      transform:translateX(-6%);
    }
    60%{
      clip-path:inset(5% 0 80% 0);
      transform:translateX(2%);
    }
    80%{
      clip-path:inset(75% 0 2% 0);
      transform:translateX(-2%);
    }
    100%{
      clip-path:inset(0 0 100% 0);
      transform:translateX(0);
      opacity:0;
    }
  }

  @keyframes slice2{
    0%{
      clip-path:inset(80% 0 5% 0);
      transform:translateX(5%);
    }
    25%{
      clip-path:inset(20% 0 60% 0);
      transform:translateX(-3%);
    }
    50%{
      clip-path:inset(45% 0 20% 0);
      transform:translateX(4%);
    }
    75%{
      clip-path:inset(10% 0 75% 0);
      transform:translateX(-5%);
    }
    100%{
      clip-path:inset(100% 0 0 0);
      transform:translateX(0);
      opacity:0;
    }
  }

  /* ---------- MATRIX SCENE ---------- */
  #matrix{
    position:absolute;
    inset:0;
    z-index:10;
    background:var(--black);
    opacity:0;
  }

  #matrix.visible{
    opacity:1;
  }

  canvas#rain{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  #scrim{
    position:absolute;
    inset:0;
    background:
      radial-gradient(
        ellipse at 50% 40%,
        rgba(2,4,3,0.35) 0%,
        rgba(2,4,3,0.82) 65%,
        rgba(2,4,3,0.95) 100%
      );
  }

  #content{
    position:relative;
    z-index:20;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:7vh 6vw;
    color:var(--green);
    max-width:520px;
    margin:0 auto;
  }

  #term{
    font-size:var(--matrix-font-size);
    line-height:1.5;
    white-space:pre-wrap;
    min-height:38vh;
    color:var(--green);
  }

  .cursor{
    display:inline-block;
    width:.55em;
    height:1em;
    background:var(--green);
    vertical-align:text-bottom;
    margin-left:2px;
    animation:blink 1s steps(1) infinite;
  }

  @keyframes blink{
    50%{opacity:0;}
  }

  /* ---------- PILL CHOICES ---------- */
  #choice{
    margin-top:calc(var(--matrix-font-size) * 0.8);
    display:none;
    flex-direction:column;
    gap:calc(var(--matrix-font-size) * 1.5);
    animation:riseIn .6s ease forwards;
  }

  #choice.visible{
    display:flex;
  }

  @keyframes riseIn{
    from{
      opacity:0;
      transform:translateY(10px);
    }
    to{
      opacity:1;
      transform:translateY(0);
    }
  }

  .code-choice-btn{
    font-family:var(--font);
    font-size:var(--matrix-font-size);
    letter-spacing:.05em;
    padding:0;
    background:transparent;
    border:none;
    color:var(--green);
    text-align:left;
    cursor:pointer;
    -webkit-appearance:none;
    text-transform:uppercase;
  }

  .code-choice-btn:active{
    opacity:.55;
  }

  .code-choice-btn:focus-visible{
    outline:1px dashed var(--green);
  }

  /* ---------- INLINE TERMINAL FORM ---------- */
  .inline-form{
    display:inline;
  }

  .inline-input{
    background:transparent;
    border:none;
    outline:none;
    caret-color:transparent;
    font-family:var(--font);
    font-size:var(--matrix-font-size);
    letter-spacing:.05em;
    color:var(--green);
    text-transform:uppercase;
    width:12ch;
    padding:0;
    margin:0;
    vertical-align:text-bottom;
  }

  .inline-input::placeholder{
    color:var(--green);
    opacity:.25;
  }

  @media (hover:none) and (pointer:coarse){
    .inline-input{
      font-size:12px;
    }
  }

  .inline-option{
    cursor:pointer;
    margin-right:18px;
    letter-spacing:.05em;
  }

  .inline-option:active{
    opacity:.55;
  }

  .inline-submit{
    font-family:var(--font);
    font-size:var(--matrix-font-size);
    letter-spacing:.1em;
    background:transparent;
    color:var(--green);
    border:1px solid var(--green);
    padding:
      calc(var(--matrix-font-size)*0.5)
      calc(var(--matrix-font-size)*0.9);
    margin-top:calc(var(--matrix-font-size) * 1.5);
    cursor:pointer;
    text-transform:uppercase;
  }

  .inline-submit:disabled{
    opacity:.35;
  }

  .inline-submit:active{
    transform:scale(.98);
  }

  .status-line{
    margin-top:calc(var(--matrix-font-size) * 0.9);
    font-size:var(--matrix-font-size);
    color:var(--green);
    opacity:.85;
  }

  /* ---------- COUNTDOWN ---------- */
  #countdown{
    display:none;
    text-align:left;
  }

  #countdown.visible{
    display:block;
    animation:riseIn .5s ease forwards;
  }

  #countdown .cd-label{
    font-size:calc(var(--matrix-font-size) * 0.85);
    letter-spacing:.1em;
    opacity:.8;
    margin-bottom:14px;
  }

  #countdown .cd-time{
    font-size:calc(var(--matrix-font-size) * 1.7);
    letter-spacing:.04em;
    line-height:1.4;
  }

  @media (prefers-reduced-motion: reduce){
    *{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
    }
  }

  /* ---------- IPHONE SAFE AREA ---------- */
  @supports (padding: env(safe-area-inset-top)){
    #app{
      background:var(--black);
    }
  }
</style>
</head>

<body>

<div id="app">

  <div id="white">
    <span>TAP TO CONTINUE</span>
  </div>

  <div id="glitch"></div>

  <div id="matrix">

    <canvas id="rain"></canvas>

    <div id="scrim"></div>

    <div id="content">

      <div id="term"></div>

      <div id="choice">
        <button class="code-choice-btn" id="opt-red">
          &gt; RED PILL — JOIN THE MATRIX
        </button>

        <button class="code-choice-btn" id="opt-blue">
          &gt; BLUE PILL — REFUSE THE MATRIX
        </button>
      </div>

      <div id="countdown"></div>

    </div>
  </div>
</div>

<script>

/* =========================================================
   KONFIGURATION
   ========================================================= */

const CONFIG = {

  sheetURL:
    "https://script.google.com/macros/s/AKfycbzjcp-if6d8SDPQyPEJu29g7G8PjGXKLR7vq_CTVNqABge0hA6nUiDOn0S8_N9VF5-aEw/exec",

  eventName: "HG_GG_HALLOWEEN",

  date: "31.10.2026",

  time: "19:00",

  location: "48.122047424316406,11.604446411132812",

  dresscode: "Science Fiction",

  startScreenText: "TAP TO CONTINUE",

  startScreenFont:
    "'Share Tech Mono', 'Courier New', monospace",

  matrixFontSize: "11px",

  pillPromptDelay: 1600,

  pillQuestion:
    "WILL YOU CHOOSE THE RED PILL OR THE BLUE PILL?",
};


/* =========================================================
   CONFIG → CSS
   ========================================================= */

document.documentElement.style.setProperty(
  '--start-font',
  CONFIG.startScreenFont
);

document.documentElement.style.setProperty(
  '--matrix-font-size',
  CONFIG.matrixFontSize
);

document.querySelector('#white span').textContent =
  CONFIG.startScreenText;


/* =========================================================
   WHITE SCREEN → GLITCH → MATRIX
   ========================================================= */

const whiteEl =
  document.getElementById('white');

const glitchEl =
  document.getElementById('glitch');

const matrixEl =
  document.getElementById('matrix');

let started = false;

function startSequence(){

  if(started) return;

  started = true;

  glitchEl.classList.add('active');

  setTimeout(()=>{
    whiteEl.classList.add('hidden');
  },120);

  setTimeout(()=>{

    matrixEl.classList.add('visible');

    startRain();

    runTerminal();

  },260);

  setTimeout(()=>{

    glitchEl.classList.remove('active');

  },600);
}

document.body.addEventListener(
  'click',
  startSequence,
  { once:true }
);


/* =========================================================
   INPUT FOCUS FALLBACK
   ========================================================= */

document.addEventListener('click',()=>{

  const activeInput =
    document.querySelector('.inline-input');

  if(
    activeInput &&
    document.activeElement !== activeInput
  ){

    activeInput.focus();

  }

});


/* =========================================================
   MATRIX RAIN
   ========================================================= */

const canvas =
  document.getElementById('rain');

const ctx =
  canvas.getContext('2d');

let columns,
    drops;

const chars =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

function resizeCanvas(){

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

  const fontSize = 16;

  columns =
    Math.floor(
      canvas.width / fontSize
    );

  drops =
    new Array(columns)
      .fill(0)
      .map(() =>
        Math.floor(
          Math.random()*-40
        )
      );
}

window.addEventListener(
  'resize',
  resizeCanvas
);

resizeCanvas();

let rainRunning = false;

function startRain(){

  if(rainRunning) return;

  rainRunning = true;

  const fontSize = 16;

  const frameDelay = 110;

  function draw(){

    ctx.fillStyle =
      'rgba(2,4,3,0.16)';

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.font =
      '600 ' +
      fontSize +
      'px "Share Tech Mono", monospace';

    for(
      let i = 0;
      i < drops.length;
      i++
    ){

      const text =
        chars[
          Math.floor(
            Math.random()*chars.length
          )
        ];

      const x =
        i * fontSize;

      const y =
        drops[i] * fontSize;

      const roll =
        Math.random();

      if(roll > 0.965){

        ctx.fillStyle =
          '#e9fff1';

      }else{

        ctx.fillStyle =
          'rgba(25,221,97,' +
          (
            0.35 +
            Math.random()*0.5
          ) +
          ')';

      }

      ctx.fillText(
        text,
        x,
        y
      );

      if(
        y > canvas.height &&
        Math.random() > 0.975
      ){

        drops[i] = 0;

      }

      drops[i]++;

    }

    setTimeout(
      () => requestAnimationFrame(draw),
      frameDelay
    );
  }

  draw();
}


/* =========================================================
   TERMINAL TYPEWRITER
   ========================================================= */

const termEl =
  document.getElementById('term');

const choiceEl =
  document.getElementById('choice');

const introLines = [

  {
    text: "> initiating secure channel...",
    pause:550
  },

  {
    text: "> access granted",
    pause:550
  },

  {
    text: "",
    pause:250
  },

  {
    text: "> EVENT: " +
      CONFIG.eventName,
    pause:120
  },

  {
    text: "> DATE:  " +
      CONFIG.date,
    pause:120
  },

  {
    text: "> TIME:  " +
      CONFIG.time,
    pause:120
  },

  {
    text: "> LOCATION: " +
      CONFIG.location,
    pause:120
  },

  {
    text: "> DRESS CODE:  " +
      CONFIG.dresscode,
    pause:120
  },

  {
    text: "",
    pause:200
  }
];


function typeLine(
  line,
  container
){

  return new Promise(resolve=>{

    const span =
      document.createElement('span');

    container.appendChild(span);

    let i = 0;

    function step(){

      if(i < line.text.length){

        span.textContent +=
          line.text[i];

        i++;

        setTimeout(
          step,
          16 + Math.random()*22
        );

      }else{

        container.appendChild(
          document.createElement('br')
        );

        setTimeout(
          resolve,
          line.pause || 100
        );
      }
    }

    step();
  });
}


function delay(ms){

  return new Promise(
    r => setTimeout(r,ms)
  );

}


async function runTerminal(){

  const cursor =
    document.createElement('span');

  cursor.className =
    'cursor';

  termEl.appendChild(cursor);

  for(
    const line of introLines
  ){

    cursor.remove();

    await typeLine(
      line,
      termEl
    );

    termEl.appendChild(cursor);

  }

  cursor.remove();

  await delay(
    CONFIG.pillPromptDelay
  );

  termEl.appendChild(cursor);

  cursor.remove();

  await typeLine(
    {
      text:CONFIG.pillQuestion,
      pause:200
    },
    termEl
  );

  choiceEl.classList.add(
    'visible'
  );
}


/* =========================================================
   PILL CHOICE
   ========================================================= */

const optRed =
  document.getElementById('opt-red');

const optBlue =
  document.getElementById('opt-blue');

let rsvpChoice = null;


async function selectPill(
  choice,
  label
){

  rsvpChoice = choice;

  choiceEl.classList.remove(
    'visible'
  );

  const cursor =
    document.createElement('span');

  cursor.className =
    'cursor';

  if(choice === 'kommt'){

    termEl.appendChild(cursor);

    await typeLine(
      {
        text:"> " + label,
        pause:250
      },
      termEl
    );

    cursor.remove();

    termEl.appendChild(cursor);

    await typeLine(
      {
        text:"> enter your details below",
        pause:300
      },
      termEl
    );

    cursor.remove();

    await delay(150);

    runRsvpForm();

  }else{

    termEl.appendChild(cursor);

    await typeLine(
      {
        text:"> " + label,
        pause:250
      },
      termEl
    );

    cursor.remove();

    termEl.appendChild(cursor);

    await typeLine(
      {
        text:
          "> entry logged. maybe next time.",
        pause:500
      },
      termEl
    );

    cursor.remove();

    sendToSheet({
      name:"",
      rsvp:"kommt nicht",
      plusOne:false,
      plusOneName:""
    });

    triggerClosingGlitch(
      startCountdown
    );
  }
}


optRed.addEventListener(
  'click',
  () =>
    selectPill(
      'kommt',
      'RED PILL — JOIN THE MATRIX'
    )
);

optBlue.addEventListener(
  'click',
  () =>
    selectPill(
      'kommt nicht',
      'BLUE PILL — REFUSE THE MATRIX'
    )
);


/* =========================================================
   INLINE TERMINAL FORM
   ========================================================= */

function typePrompt(text){

  return new Promise(resolve=>{

    const span =
      document.createElement('span');

    termEl.appendChild(span);

    let i = 0;

    function step(){

      if(i < text.length){

        span.textContent +=
          text[i];

        i++;

        setTimeout(
          step,
          16 + Math.random()*22
        );

      }else{

        resolve(span);

      }
    }

    step();
  });
}


function promptInput(
  promptText,
  placeholder
){

  return new Promise(
    async resolve=>{

      await typePrompt(
        promptText
      );

      const form =
        document.createElement('form');

      form.className =
        'inline-form';

      form.setAttribute(
        'novalidate',
        ''
      );

      const input =
        document.createElement('input');

      input.type = 'text';

      input.className =
        'inline-input';

      if(placeholder)
        input.placeholder =
          placeholder;

      input.autocomplete =
        'name';

      input.enterKeyHint =
        'done';

      input.inputMode =
        'text';

      form.appendChild(input);

      termEl.appendChild(form);

      const cursor =
        document.createElement('span');

      cursor.className =
        'cursor';

      termEl.appendChild(cursor);

      input.focus();

      form.addEventListener(
        'submit',
        e=>{

          e.preventDefault();

          const val =
            input.value.trim();

          if(!val) return;

          cursor.remove();

          const valSpan =
            document.createElement('span');

          valSpan.textContent =
            val.toUpperCase();

          form.replaceWith(
            valSpan
          );

          termEl.appendChild(
            document.createElement('br')
          );

          resolve(val);
        }
      );
    }
  );
}


/* =========================================================
   YES / NO
   ========================================================= */

function promptYesNo(
  promptText
){

  return new Promise(
    async resolve=>{

      await typePrompt(
        promptText + " "
      );

      const wrap =
        document.createElement('span');

      const yes =
        document.createElement('span');

      yes.textContent =
        '[YES]';

      yes.className =
        'inline-option';

      const no =
        document.createElement('span');

      no.textContent =
        '[NO]';

      no.className =
        'inline-option';

      wrap.appendChild(yes);

      wrap.appendChild(no);

      termEl.appendChild(wrap);


      function choose(
        val,
        label
      ){

        wrap.remove();

        const chosen =
          document.createElement('span');

        chosen.textContent =
          label;

        termEl.appendChild(
          chosen
        );

        termEl.appendChild(
          document.createElement('br')
        );

        resolve(val);
      }


      yes.addEventListener(
        'click',
        () =>
          choose(
            true,
            '[YES]'
          )
      );

      no.addEventListener(
        'click',
        () =>
          choose(
            false,
            '[NO]'
          )
      );

    }
  );
}


/* =========================================================
   SUBMIT
   ========================================================= */

function promptSubmit(){

  return new Promise(
    resolve=>{

      termEl.appendChild(
        document.createElement('br')
      );

      const btn =
        document.createElement('button');

      btn.type =
        'button';

      btn.className =
        'inline-submit';

      btn.textContent =
        '> SUBMIT';

      termEl.appendChild(btn);

      btn.addEventListener(
        'click',
        () => resolve(btn),
        { once:true }
      );

    }
  );
}


function appendStatus(text){

  const s =
    document.createElement('div');

  s.className =
    'status-line';

  s.textContent =
    text;

  termEl.appendChild(s);

  return s;
}


/* =========================================================
   RSVP FORM
   ========================================================= */

async function runRsvpForm(){

  const name =
    await promptInput(
      'NAME: '
    );

  const wantsPlusOne =
    await promptYesNo(
      'PLUS ONE?'
    );

  let plusOneName = '';

  if(wantsPlusOne){

    plusOneName =
      await promptInput(
        'NAME PLUS ONE: '
      );
  }

  const submitBtn =
    await promptSubmit();

  submitBtn.disabled =
    true;

  const statusEl =
    appendStatus(
      '> TRANSMITTING...'
    );

  const payload = {

    name:name,

    rsvp:rsvpChoice,

    plusOne:wantsPlusOne,

    plusOneName:plusOneName
  };


  try{

    if(
      CONFIG.sheetURL &&
      CONFIG.sheetURL.startsWith("http")
    ){

      await fetch(
        CONFIG.sheetURL,
        {
          method:"POST",
          mode:"no-cors",
          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },
          body:
            JSON.stringify(payload)
        }
      );
    }

    statusEl.textContent =
      "> welcome, " +
      name.toUpperCase() +
      ". see you there.";

    setTimeout(
      () =>
        triggerClosingGlitch(
          startCountdown
        ),
      900
    );

  }catch(err){

    statusEl.textContent =
      "> transmission failed — try again";

    submitBtn.disabled =
      false;
  }
}


/* =========================================================
   OPTIONAL LOGGING
   ========================================================= */

async function sendToSheet(
  payload
){

  if(
    !(
      CONFIG.sheetURL &&
      CONFIG.sheetURL.startsWith("http")
    )
  ) return;

  try{

    await fetch(
      CONFIG.sheetURL,
      {
        method:"POST",
        mode:"no-cors",
        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },
        body:
          JSON.stringify(payload)
      }
    );

  }catch(err){

    /* stiller Fehlschlag */

  }
}


/* =========================================================
   GLITCH → COUNTDOWN
   ========================================================= */

function triggerClosingGlitch(
  next
){

  glitchEl.classList.add(
    'active'
  );

  setTimeout(
    ()=>{
      termEl.innerHTML = '';
      choiceEl.classList.remove(
        'visible'
      );
    },
    300
  );

  setTimeout(
    ()=>{
      glitchEl.classList.remove(
        'active'
      );

      next();

    },
    650
  );
}


const countdownEl =
  document.getElementById(
    'countdown'
  );


function getPartyDate(){

  const [
    d,
    m,
    y
  ] =
    CONFIG.date
      .split('.')
      .map(Number);

  const [
    hh,
    mm
  ] =
    CONFIG.time
      .split(':')
      .map(Number);

  return new Date(
    y,
    m - 1,
    d,
    hh,
    mm,
    0
  );
}


function pad(n){

  return String(n)
    .padStart(2,'0');

}


function startCountdown(){

  countdownEl.classList.add(
    'visible'
  );

  const target =
    getPartyDate();


  function tick(){

    const diff =
      target - new Date();

    if(diff <= 0){

      countdownEl.innerHTML =

        '<div class="cd-label">' +
        '&gt; status' +
        '</div>' +

        '<div class="cd-time">' +
        CONFIG.eventName.toLowerCase() +
        ' is live' +
        '</div>';

      clearInterval(timer);

      return;
    }


    const s =
      Math.floor(
        diff / 1000
      );

    const days =
      Math.floor(
        s / 86400
      );

    const hours =
      Math.floor(
        (s % 86400) / 3600
      );

    const mins =
      Math.floor(
        (s % 3600) / 60
      );

    const secs =
      s % 60;


    countdownEl.innerHTML =

      '<div class="cd-label">' +
      '&gt; countdown to ' +
      CONFIG.eventName.toLowerCase() +
      '</div>' +

      '<div class="cd-time">' +
      pad(days) +
      'D ' +
      pad(hours) +
      'H ' +
      pad(mins) +
      'M ' +
      pad(secs) +
      'S' +
      '</div>';
  }


  tick();

  const timer =
    setInterval(
      tick,
      1000
    );
}

</script>
